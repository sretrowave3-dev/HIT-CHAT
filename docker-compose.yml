version: '3.8'

services:
  redis:
    image: redis:7.2-alpine
    container_name: campusnet-redis
    command: >
      redis-server 
      --maxmemory 256mb 
      --maxmemory-policy volatile-ttl 
      --notify-keyspace-events KEA 
      --appendonly no
    ports:
      - "6379:6379"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  postgres:
    image: postgis/postgis:16-3.4-alpine
    container_name: campusnet-postgres
    environment:
      POSTGRES_DB: campusnet
      POSTGRES_USER: campusnet
      POSTGRES_PASSWORD: campusnet_secret
    ports:
      - "5432:5432"
    volumes:
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init.sql
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U campusnet -d campusnet"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  pgdata:
    driver: local
